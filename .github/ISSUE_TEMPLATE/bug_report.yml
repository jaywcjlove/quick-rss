name: 🙋‍♂️ [QuickRSS] - Support & Feedback
description: Get help with QuickRSS, report bugs, or request features.
title: '🙋‍♂️ Support & Feedback: Quick RSS'
labels: ['support', 'feedback', 'question']
assignees:
  - jaywcjlove
body:
  - type: markdown
    attributes:
      value: |
        <img align="right" height="86" alt="QuickRSS" src="https://github.com/user-attachments/assets/3e694247-ad5c-4ac8-a4ae-8b89352324d4"> Please provide as much detail as possible about your support request or feedback.

        **Quick RSS** is a simple, private, and intuitive desktop RSS reader application. Whether you are a news enthusiast or enjoy following blog posts and headlines, Quick RSS helps you easily manage and read your favorite RSS feeds.

        ### Contact Information

        If you encounter any issues or need support while using our app, please feel free to contact us through the following methods:

        - **Email Support**: [kennyiseeyou@gmail.com](mailto:kennyiseeyou@gmail.com)
        - **Social Media**: [Twitter](https://twitter.com/jaywcjlove)

        We will respond to your message as soon as possible. Thank you for your support of our app!

  - type: textarea
    attributes:
      label: 🙋‍♂️ What do you need help with?
      description: Describe the issue or feedback you have for Quick RSS.
      placeholder: ex. I have trouble configuring the RSS feed or I want to suggest a new feature.
    validations:
      required: true

  - type: dropdown
    id: os_version
    attributes:
      label: "💻 Operating System"
      description: "Select your operating system and version."
      options:
        - macOS 27.x (Tahoe)
        - macOS 26.x (Tahoe)
        - macOS 15.x (Sequoia)
        - macOS 14.x (Sonoma)
        - iOS 26.x
        - iOS 18.x
        - iOS 17.x
        - iPadOS 26.x
        - iPadOS 18.x
        - iPadOS 17.x
        - Other
      default: 0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **How can I send you a crash report for one of your apps?**

        - macOS Open Finder
        - Select Go to **Folder…** from the Go menu <kbd>⇧</kbd> + <kbd>⌘</kbd> + <kbd>G</kbd>
        - Enter: **~/Library/Logs/DiagnosticReports**
        - In the resulting list, select all files that starts with the app name, ZIP them, and send me
        - Attach the file to this issue


  - type: textarea
    attributes:
      label: ℹ️ Additional context
      description: Add any additional information that could be helpful.
      placeholder: ex. Screenshots, steps to reproduce, etc.
    validations:
      required: false